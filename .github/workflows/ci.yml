name: ProductFlow AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q mcp_server telegram_bot web_admin scripts

      - name: Run tests
        env:
          BOT_TOKEN: "1234567890:CI_TEST_TOKEN"
          OPENAI_API_KEY: ""
          PRODUCT_MCP_DB_PATH: "./data/products.sqlite3"
          WEB_ADMIN_PASSWORD: "ci-test-password"
          WEB_API_KEY: "ci-test-api-key"
          WEB_SESSION_SECRET: "ci-test-session-secret"
        run: python -m pytest -ra
